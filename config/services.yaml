# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Domain\Child\Repository\ChildRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineChildRepository
    App\Domain\Event\Repository\EventTypeRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineEventTypeRepository
    App\Domain\Event\Repository\EventRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineEventRepository
    App\Domain\Registration\Repository\RegistrationRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineRegistrationRepository
    App\Domain\ChildInvite\Repository\ChildInviteRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineChildInviteRepository
    App\Domain\ChildInvite\Service\InviteCodeGeneratorInterface:
        alias: App\Infrastructure\Security\RandomInviteCodeGenerator
    App\Domain\User\Service\PasswordHasherInterface:
        alias: App\Infrastructure\Security\Argon2PasswordHasher
    App\Domain\Auth\Service\TokenValueGeneratorInterface:
        alias: App\Infrastructure\Security\UrlSafeTokenGenerator
    App\Domain\Auth\Repository\AccessTokenRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineAccessTokenRepository
    App\Domain\Child\Repository\ChildAccessRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineChildRepository
    App\Domain\Event\Repository\EventTypeReadRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineEventTypeRepository
    App\Domain\Event\Repository\EventTypeWriteRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineEventTypeRepository
    App\Domain\Event\Repository\EventReadRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineEventRepository
    App\Domain\Event\Repository\EventWriteRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineEventRepository
    App\Domain\Sleep\Repository\SleepPredictRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineSleepPredictRepository
    App\Domain\Account\Repository\AccountDeletionRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineAccountDeletionRepository
    App\Domain\ChildUser\Repository\ChildUserRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineChildUserRepository

    # TTL приглашения — скаляр, автовайрить нечего, задаём явно из env.
    App\Domain\ChildInvite\Service\ChildInviteFactory:
        arguments:
            $ttlSeconds: '%env(int:CHILD_INVITE_TTL_SECONDS)%'

    # TTL access-токена должен совпадать с lifetime_seconds в FastAPI.
    App\Application\Auth\AuthenticateByToken:
        arguments:
            $ttlSeconds: '%env(int:ACCESS_TOKEN_TTL_SECONDS)%'
